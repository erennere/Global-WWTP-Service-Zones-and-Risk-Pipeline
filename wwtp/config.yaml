# Section order below follows the canonical workflow derived from the repo wrappers and READMEs.
# Put a shared parameter on the first script that actually consumes it.
# Later scripts inherit that value by setting the field to null.
# A later concrete value overrides only that script.
# CLI overrides take precedence over all resolved config values.
correct_locations_w_OSM:
  version: '2'
  rad: 5000
  # Explicit values (not null) because this is the first config section, so
  # there is no earlier canonical section to inherit from. create_voronoi's
  # matching keys (country_output_column/country_boundary_column) are the
  # section later scripts inherit these from via null.
  country_output_column: 'ISO_2'
  country_boundary_column: 'country'
  paths:
    data_dir: '../data'
    corrected_south: '{data_dir}/corrected_WWTP_enhanced_v{version}.geojson'
    osmgeo_filepath: '{data_dir}/wastewater_plant.geojson'
    paul_corrected_filepath: '{data_dir}/Enhanced_HW_WWTP__jun20_2025.geojson'
    overture: '{data_dir}/overture_maps_countries.parquet'
    overture_s3_url: 's3://overturemaps-us-west-2/release/2025-01-22.0/theme=divisions/type=division_area/*'

# Run manifests (wwtp/provenance.py): every stage writes one YAML per run with
# the resolved config, git commit, package versions and input fingerprints.
run_manifest:
  # Inputs up to this size get a SHA-256; larger ones only size and time.
  hash_max_mb: 200
  paths:
    data_dir: null
    manifest_dir: '{data_dir}/run_manifests'

merge_seg_results:
  version: null
  legacy_merge: true
  paths:
    data_dir: null
    corrected_south: null
    seg_corrected_south: '{data_dir}/seg_corrected_WWTP_enhanced_v{version}.gpkg'
    corrected_all_filepath: '{data_dir}/all_merged_v{version}.gpkg'
    dl_dir: '{data_dir}/DL_results'
    dl_zipfile: '{data_dir}/DL_results/csvv2-2.zip'
    dl_mapfile: '{data_dir}/DL_results/aftersort.geojson'
    seg_results_filepath: '/mnt/sds-hd/sd17f001/sukanya/wtp_seg/2026_global/Images_z17_512/results/csv/segoutput.csv'

final_data_merge:
  version: null
  legacy_merge: null
  threshold: 500
  osm_threshold: 1000
  paths:
    data_dir: null
    corrected_south: null
    seg_corrected_south: null
    corrected_all_filepath: null
    canada_filepath: '{data_dir}/extra_points/Canada_14_03_2025.csv'
    germany_filepath: '{data_dir}/extra_points/Germany_Hydra_waste_geospatial_corrected.geojson'
    osmgeo_filepath: null
    us_new_filepath: '{data_dir}/final_data_source/final_USA_WWT_dec3.geojson'
    eu_new_filepath: '{data_dir}/final_data_source/final_W_europe_WWT_dec3.geojson'
    thailand_filepath: '{data_dir}/final_data_source/Thailand_500m_merged.geojson'
    new_points_filepath: '{data_dir}/new_locations_v{version}.gpkg'

combine_watersheds:
  # HydroBASINS level of the basins that bound the service areas (approach 1):
  # higher numbers = smaller basins. Level 6 (median ~5,600 km2 in GB) lets a
  # city's service area cross the small level-8 basins its sewers cross.
  level: '6'
  paths:
    data_dir: null
    watersheds_zip_dir: '{data_dir}/hydroshed_river_levels/lvl{level}'
    watershed: '{data_dir}/hydroshed_river_levels/hydrobase_lvl{level}_combined.gpkg'

