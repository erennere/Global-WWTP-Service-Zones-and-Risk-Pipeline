    can_wser: {source: 'can_eccc_wser', file: 'Resaeu-Wser-identification.csv', iso2: 'CA', year: 2025, encoding: 'cp1252'}
    aus_ga: {source: 'aus_ga_wwtf', file: 'wastewater_treatment_facilities.geojson', iso2: 'AU', year: 2012, encoding: 'utf-8'}
  paths:
    data_dir: null
    annotated_all_filepath: null
    validation_dir: '{data_dir}/validation_data'
    output_dir: '{data_dir}/validation_data/national_data'

# National plant lists for the countries our plant list lacks, in its columns
# (wwtp/data_merge/national_plants.py, rule national_plants; see the module for the rules):
# Australia (Geoscience Australia), Canada (WSER plants farther than national_data.match_distance_m
# from ours), Japan (MLIT P22 FY2012 treatment plants, one zip per prefecture in p22_dir), New Zealand
# (OpenStreetMap: no national point layer), with the HydroWASTE records of the countries our list does
# not cover. Output: national_plants.gpkg / .csv, national_plants_left_out.csv.
national_plants:
  countries: ['AU', 'CA', 'JP', 'NZ']
  registers: {AU: 'aus_ga', CA: 'can_wser'}        # in national_data's register_plants
  hydrowaste_countries: ['AU', 'JP', 'NZ']         # not covered by our list: their HydroWASTE records too
  osm_bbox: {NZ: [165, -48, 179.99, -33]}          # lon min, lat min, lon max, lat max
  osm_group_distance_m: 500                        # OSM parts closer than this: one plant
  osm_skip_names: '(?i)pump(?:ing)? station|lift station|oil separator|^old |^(?!.*waste).*water treatment plan'
  metric_crs: {AU: 3577, CA: 3978, JP: 6691, NZ: 2193}
  not_operational: ['Decommissioned', 'Non-Operational', 'Under Construction', 'Closed', 'Proposed']
  left_out_subtypes: ['Storm Sewage Treatment Plant', 'Septage Facility']   # Geoscience Australia
  match_distance_m: 1000                           # national plant and HydroWASTE record: one plant
  name_match_distance_m: 25000                     # ... with the same name
  approximate_match_distance_m: 5000               # ... with an approximate HydroWASTE location (QUAL_LOC 2)
  approximate_match_countries: ['NZ']
  complete_register_countries: ['JP']              # an unmatched HydroWASTE record near a register plant: a shifted duplicate
  complete_register_distance_m: 15000
  name_stopwords: ['wwtp', 'stp', 'wwtf', 'wtp', 'sewage', 'sewerage', 'treatment', 'plant', 'wastewater', 'waste',
                   'water', 'works', 'ponds', 'pond', 'oxidation', 'the', 'scheme', 'and', 'facility', 'of', 'lagoon', 'lagoons']
  register_years: {aus_ga: 2026, can_wser: 2025, jpn_p22: 2012, osm: 2023}
  paths:
    data_dir: null
    corrected_all_filepath: '{data_dir}/all_merged_v2.gpkg'   # the plant list whose columns the output gets
    register_plants: '{data_dir}/validation_data/national_data/register_plants.gpkg'
    p22_dir: '{data_dir}/validation_data/jpn_mlit_p22'
    osmgeo_filepath: null
    hydrowaste: null
    output_dir: '{data_dir}/national_plants'

# The plants that need a new image to get a size, and the new plants (wwtp/data_merge/work_list.py):
# the annotation set of NEW_01_GENERATEGRIDS. The corrected EU file is the truth in its countries.
work_list:
  same_site_distance_m: 500          # closer than this: the same plant (final_data_merge.threshold)
  reference_offset_m: 1              # a reference plant the rebuild puts farther away goes back to its reference position
  code_countries: {EL: GR}           # uwwCode prefixes that are not ISO 3166 country codes
  # Overseas parts of file countries with an ISO 3166 code of their own: lon min, lat min, lon max, lat max
  territories:
    GP: [-61.9, 15.8, -61.0, 16.6]     # Guadeloupe
    MQ: [-61.3, 14.3, -60.8, 14.9]     # Martinique
    GF: [-54.7, 2.1, -51.5, 5.9]       # French Guiana
    RE: [55.2, -21.4, 55.9, -20.8]     # Réunion
    YT: [44.9, -13.1, 45.4, -12.6]     # Mayotte
    MF: [-63.2, 18.04, -62.95, 18.13]  # Saint-Martin
  size_groups:
    lagoon: '4 no tanks, lagoon detected'
    nothing: '5 no tanks, nothing detected'
    new: '6 new plant, not processed yet'
  paths:
    data_dir: null
    # The population layer the list was made from: the configured variant of version 2
    population_layer: '{data_dir}/pop_voronoi_layers/v2/lvl6/bfrep/sz/pop_added_appr_1_v2_lvl6_bfrep_sz_mult.gpkg'
    corrected_all_filepath: '{data_dir}/all_merged_v2.gpkg'
    # The corrected EU file (UWWTD plants with checked locations), not final_data_merge's eu_new_filepath
    eu_file: '{data_dir}/extra_points/final_W_europe_WWT_dec3.geojson'
    national_plants_dir: '{data_dir}/national_plants'
    work_list: '{data_dir}/heigit_sizes/plants_without_size_and_new_plants.gpkg'
    removed_plants: '{data_dir}/heigit_sizes/plants_removed_not_in_eu_file.csv'
    eu_file_not_added: '{data_dir}/heigit_sizes/eu_file_plants_not_added.csv'
    # The new plants alone (national registers AU/CA/JP/NZ, corrected EU file): the plants all_merged_v2 lacks
    new_plants: '{data_dir}/heigit_sizes/new_plants_national_and_eu_file.gpkg'
    # The list the new images were taken from (17 Nov 2026, in git): its plants stay as they were (idx, row
    # order, position; matched by plant_id); plants it lacks come after it
    reference_list: '{data_dir}/heigit_sizes/work_list_reference_2026-11-17.csv'

# Plant list v3 (wwtp/data_merge/plants_v3.py): all_annotated_v2 with the work list applied (removed,
# moved and new plants) and the results of the new images (tank detections, site category); same sites
# merged, every plant renumbered. The analysis runs on it with correct_locations_w_OSM.version '3'.
plants_v3:
  same_site_distance_m: null         # work_list's
  code_countries: null
  territories: null
  wrong_code_shift_m: 50000          # a longer move to the EU file's location: the plant had another plant's code
  max_image_offset_m: null           # download_bing_annotate's
  detection_columns: ['num_detection_circle', 'diameters', 'num_detection_rect', 'wwtp_area_rect']
  category_columns: ['category_number', 'category_name', 'justification']
  # The new images' site categories (image-to-text, paths.image_text_results): false while they do not
  # exist; plants then keep their v2 category (new plants none). True since 20 Nov 2026 (the 5,384 new plants).
  with_image_text: true
  # Which segmentation image is which ref.geojson feature: ref_idx = <n>.png is the feature whose idx is n
  # (Sukanya's numbering: v2's merge_seg_results joined img_name to idx; the new plants' images checked by eye)
  image_names: ref_idx
  # Location of the merged plant when plants share a site: the first source in this order
  location_priority: ['corrected_eu_file', 'national_plants', 'v2']
  paths:
    data_dir: null
    base_filepath: '{data_dir}/all_annotated_v2.gpkg'
    work_list: null
    removed_plants: null
    eu_file: null
    # The new images (512 x 512 px, zoom 17; Sukanya, 18 Nov 2026): ref.geojson (idx of the plant of image
    # <row>.png) and the segmentation results.
    images_ref: '/mnt/sds-hd/sd17f001/sukanya/wtp_seg/2026_global_extra/Images_z17_512/ref.geojson'
    # what images_ref's idx counts rows of: the work list as Sukanya got it (17 Nov 2026, in git)
    images_ref_list: '{data_dir}/heigit_sizes/work_list_reference_2026-11-17.csv'
    segmentation_results: '/mnt/sds-hd/sd17f001/sukanya/wtp_seg/2026_global_extra/Images_z17_512/results/csv/segoutput.csv'
    # Image-to-text of the new plants' annotated 3072 px images (Sukanya; path from Eren, 20 Nov 2026):
    # 5,384 rows, image bbox_<idx>.png = idx 59714-65097 of image_text_list, every row with a decision
    image_text_results: '/mnt/sds-hd/sd17f001/sukanya/wtp_seg/2026_global_extra/annotated/mm/Images_z17_3072/outputmodel/inference/csv_files/chunk_1/i2t_res1.csv'
    # The plants whose site category comes from the new image-to-text results: the new plants (old plants
    # keep their v2 category)
    image_text_list: '{data_dir}/heigit_sizes/new_plants_reference_2026-11-19.csv'
    output: '{data_dir}/all_annotated_v3.gpkg'
    summary: '{data_dir}/heigit_sizes/plants_v3_summary.csv'
    # Segmentation results not given to any plant (image not verified to show it), with the reason
    unused_image_results: '{data_dir}/heigit_sizes/plants_v3_unused_image_results.csv'

# Calibration on national statistics (wwtp/calibration/connection_radius.py; Snakemake target
# `calibration`). For every country with plants and a WorldPop raster: the share of its people inside
# service areas as a function of radius_at_10k_people_km, with the stand-in of
# wwtp/calibration/service_radius.py (each person goes to the plant with the smallest distance /
# sqrt(people) among its candidate_plants nearest, kept inside that plant's circle, at most max_buffer).
# From those curves and the national connection statistics (reference_urls), `calibrate` derives the
# national size scale and the radius rule r10k = min(cap, exp(a + b logit(connected share))), and from
# our plants the country parts of the plant size. Its tables are the source of create_voronoi's
# footprint_to_people, size_scale and radius_calibration.*.by_connection; nothing is written to config.
connection_radius:
  version: null
  year: 2022                  # WorldPop raster year (download_pop keeps 2015-2024)
  aggregate_cells: 10         # 100 m cells summed to 1 km
  candidate_plants: 64
  size_measures: ['reported', 'footprint', 'combined_25', 'combined_50', 'combined_75']
  radius_exponents: [0.3, 0.5]
  # radius_at_10k_people_km grid: count values, geometric from start to stop (km)
  radius_grid: {start: 0.5, stop: 40.0, count: 40}
  max_workers: 16
  max_buffer: null
  footprint_to_people: null
  reported_size_columns: null
  reported_size_skip: null
  country_output_column: null
  country_boundary_column: null
  # National connection statistics, saved unparsed: JMP household world file (sewer connections,
  # wastewater treated), Eurostat population connected to wastewater treatment, OECD wastewater
  # treatment. Downloaded on the machine that runs Snakemake (compute nodes may have no internet).
  reference_urls:
    jmp_household.xlsx: 'https://washdata.org/data/country/WLD/household/download'
    eurostat_env_ww_con.tsv: 'https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/env_ww_con?format=TSV'
    oecd_water_treat.csv: 'https://sdmx.oecd.org/public/rest/data/OECD.ENV.EPI,DSD_WATER_TREAT@DF_WATER_TREAT,1.0/all?format=csvfilewithlabels'
  request_timeout_seconds: 120
  # The share of people connected to wastewater treatment, per source, in the year nearest `year`:
  # JMP "safely managed via sewer" (sewer connections whose wastewater is treated; sheet 'san'),
  # Eurostat 'connected to urban and other wastewater treatment' (ww_tp URB_OTH_CS, unit PC), OECD
  # 'public total treatment' (PUBTOTTR). fit_reference is fitted and scored; the others are checks.
  reference_files: {jmp: 'jmp_household.xlsx', eurostat: 'eurostat_env_ww_con.tsv', oecd: 'oecd_water_treat.csv'}
  reference_series: {jmp: 'san_sew_sm_t', eurostat: 'URB_OTH_CS', oecd: 'PUBTOTTR'}
  eurostat_geo_aliases: {EL: 'GR', UK: 'GB'}   # Eurostat country codes that are not ISO 3166
  reference_max_year_gap: 5   # per country the value of the year nearest `year`; dropped if further away
  fit_reference: 'jmp'
  # Fit (light; runs anywhere): log r10k = a + b logit(predictor), cross-validated over countries.
  # Predictors: 'reference' (the connected share itself) and 'reported_coverage' (sum of our plants'
  # reported sizes / national population: our data only, so the reference stays a pure check).
  fit_predictors: ['reference', 'reported_coverage']
  fit_folds: 5
  fit_seed: 0
  # calibrate: caps (km) of r10k = min(cap, exp(a + b logit(C))) to tabulate, each tested by leaving one
  # SDG region out with every pair of size-scale limits; the pair (limits, cap) is then chosen with the
  # plant-level check (create_voronoi.size_scale; notes/size_calibration_2026-11-12.md).
  calibration_caps_km: [3.0, 3.5, 4.0, 4.5, 5.0, 5.25, 5.5, 5.75, 6.0, 6.5, 7.0, 8.0, 40.0]
  # Limits of the national size scale (create_voronoi.size_scale) that calibrate tests with every cap;
  # min 1 and max 1 = no scale.
  calibration_size_scale_limits: [{min: 1, max: 1}, {min: 0.3333, max: 3}, {min: 0.2, max: 5}, {min: 0.1, max: 10}]
  # Fewest plants a country value of the plant size rests on (footprint_to_people.country_offsets,
  # unsized_people_by_country).
  size_country_min_plants: 30
  # calibrate: the same served shares (leaving one region out) also against these national references,
  # which are not fitted. SDG 6.3.1 (WHO / UN-Habitat 2025 summary, downloaded by national_data):
  # household wastewater volume in sewers / total household volume x share of the sewer flow
  # delivered to treatment = share of people whose sewage reaches treatment through a sewer.
  check_references: ['sdg631', 'eurostat', 'oecd']
  sdg631:
    sheet: 'Countries'
    iso3: 'Country ID (iso3)'
    total_volume: 'Volume of wastewater generated, Household, Total'
    sewer_volume: 'Volume of wastewater generated, Household, Sewers'
    sewer_delivered_percent: 'Proportion of wastewater flow delivered to treatment, Household, Sewers'
    year: 2022
  # plant_check (wwtp/calibration/plant_check.py): every calibrate configuration where the real
  # catchments are known. Built-in references (paths of the sweep_validation section) and polygon
  # files of real catchments downloaded by national_data (folder, file, country). A reference whose
  # file is missing is listed in plant_check_status.csv and left out.
  plant_reference_kinds: ['us_sewersheds', 'gb_catchments', 'nl_cbs']
  # Polygons: every polygon layer of the files in the source folder.
  plant_reference_polygons:
    nl_units: {iso2: 'NL', source: 'nld_zuiveringseenheid'}
    ie_agglomerations: {iso2: 'IE', source: 'irl_epa_agglomerations'}
    es_agglomerations: {iso2: 'ES', source: 'esp_miteco_agglomerations'}
  # Our plant to a polygon of plant_reference_polygons (outfall plants often lie just outside).
  polygon_match_distance_m: 1000
  # Census localities: served share by municipality against the share of dwellings with drainage
  # (public sewer or septic tank, so an upper bound). Reported, not used in the choice.
  district_references:
    mx_iter_2020:
      iso2: 'MX'
      source: 'mex_inegi_iter_2020'
      file: 'iter_00_cpv2020_csv.zip'
      member: 'iter_00_cpv2020/conjunto_de_datos/conjunto_de_datos_iter_00CSV20.csv'
      columns: {state: 'ENTIDAD', municipality: 'MUN', locality: 'LOC', lon: 'LONGITUD', lat: 'LATITUD', people: 'POBTOT', dwellings: 'VIVPAR_HAB', drainage: 'VPH_DRENAJ'}
      aggregate_localities: ['0000', '9998', '9999']   # totals and grouped small localities
      total_municipality: '000'
  # The choice: national error = mean of these (jmp: leaving one SDG region out; the others: the same
  # served shares against that reference), among the configurations whose plant-level error is not
  # above the fixed radius's.
  choice_national: ['jmp', 'sdg631']
  # "Not above the fixed radius's" is tested by a paired bootstrap over the reference units (drawn
  # within their size class): a configuration is excluded when it is worse in at least plant_confidence
  # of the samples. The plant-level errors of the configurations differ by less than their noise, so a
  # plain comparison would choose by chance (run of 13 Nov).
  plant_bootstrap_samples: 1000
  plant_bootstrap_seed: 0
  plant_confidence: 0.95
  paths:
    data_dir: null
    annotated_all_filepath: null
    overture: null
    overture_s3_url: null
    pop_tif_dir: null
    validation_dir: null
    sdg631: '{data_dir}/validation_data/sdg_631/who_2025_sdg631_domestic_wastewater_summary.xlsx'
    output_dir: '{data_dir}/calibration/connection_radius'

# Figure 1 (figures/fig1/): HeiGIT vs reference plants per country / HydroBASINS
# unit, and the served-population cartogram. Scripts read these through
# figures/fig1/fig1_config.py; their outputs and inputs live under data_dir.
figure1:
  # Units with fewer matched plants than this are hatched instead of coloured.
  min_plants: 5
  # A HeiGIT and a reference plant closer than this are the same plant.
  match_radius_m: 10000
  paths:
    data_dir: null
    match_dir: '{data_dir}/figures/fig1/match'
    cartogram_dir: '{data_dir}/figures/fig1/cartogram'
    combined_dir: '{data_dir}/figures/fig1/combined'
    # HeiGIT plants with their attributes, read by fid (the tanks panel: plant types)
    heigit_attrs: '{data_dir}/figures/fig1/match/data/HeiGIT_WWTP_LVL9_BFK0_8_LOG_MULT.gpkg'
    # HydroBASINS v1c: hybas_lev03/04_v1c.gpkg, hybas_lev08/09_v1c_attributes.csv
    hydrobasins_dir: '{data_dir}/figures/fig1/hydrobasins'

# Extended Data figures of the calibration and the numbers its Methods text quotes
# (wwtp/figures_scripts/calibration_figures.py, rule calibration_figures; paper/methods_calibration.tex).
# Reads the tables of connection_radius.paths.output_dir. Nature style: 180 mm wide, 5-7 pt text.
calibration_figures:
  size_measure: 'reported'          # the size measure of the paper's service areas
  example_countries: ['IN', 'BR', 'CN', 'US', 'DE']   # served-share curves, one colour each (max 5)
  label_countries: ['IN', 'CN', 'BR', 'MX', 'US', 'DE', 'GB', 'NG', 'ID', 'EG']
  # per-catchment panels (max 4): plant reference of connection_radius -> [country, dataset] (title lines)
  catchment_panels:
    us_sewersheds: ['United States', 'EPA sewersheds']
    gb_catchments: ['Great Britain', 'sewage catchments']
    nl_cbs: ['Netherlands', 'CBS inhabitants per plant']
    ie_agglomerations: ['Ireland', 'EPA agglomerations']
  label_caps_km: [3.0, 5.0, 7.0, 40.0]   # caps written next to the chosen scale's line; the largest reads "no cap"
  width_mm: 180
  heights_mm: {plant_size: 64, service_radius: 122, catchments: 112}
  font_family: ['Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans']
  font_size_pt: 6
  dpi: 600
  sequential_cmap: 'Blues'
  colors:
    ink: '#1a1a1a'
    secondary: '#5a5a5a'
    muted: '#9a9a9a'
    grid_ink: '#c8c8c8'
    band: '#eeeeee'
    surface: '#ffffff'
    series: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4']
  paths:
    data_dir: null
    output_dir: '{data_dir}/figures/calibration'

# Validation of the recommended sweep candidate as maps, plots and tables
# (wwtp/figures_scripts/validation_figures.py, rule validation_figures). Reads the sweep_validation
# outputs. Style (fonts, widths, colours) as calibration_figures.
validation_figures:
  # Per-plant maps, each a family of references: sweep_validation references (gb catchments, nl CBS,
  # us sewersheds, hw, uwwtd) or register_references below. A country with several references of one
  # family pools them.
  plant_maps:
    catchments: ['gb', 'nl', 'us']
    reported: ['hw_reported', 'cwns_2022', 'uwwtd_load']
  plant_map_titles:
    catchments: 'real catchments (independent)'
    reported: 'reported plant numbers (national statistics, UWWTD loads in residents; also inputs of the sizes)'
  plant_map_short: {catchments: 'real catchments', reported: 'reported plant numbers'}
  # Plant numbers from national statistics in the recommended candidate's population layer, each
  # against our people in that plant's service area in `year` (<year>_zonal_sum): the column, the
  # values of other columns a plant must have, the population year, the unit ('people', or 'pe':
  # population equivalents, converted to residents with pe_conversion).
  register_references:
    hw_reported: {column: 'POP_SERVED', only: {QUAL_POP: [1]}, year: 2024, unit: 'people'}
    cwns_2022: {column: 'EPA POP 2022', only: {ISO_2: ['US']}, year: 2022, unit: 'people'}   # 33 plants elsewhere carry US values (merge error)
    uwwtd_load: {column: 'uwwLoadEnteringUWWTP', only: {}, year: 2024, unit: 'pe'}
  # Population equivalents (1 p.e. = 60 g BOD5 a day) count residents plus industry, commerce,
  # commuters and tourists, and a resident makes less than 1 p.e. (about 45 g BOD5 a day). A country's
  # p.e. per connected resident = its plants' total load / its residents connected to treatment (people
  # x share of the first of national_references with a number); each load is divided by it. A country
  # below min_pe_per_resident (what residents alone make: 44.6 / 60 g, about 0.75) misses loads (e.g. a
  # large plant without one) and, like a country without a national number, takes the ratio of all
  # others together.
  pe_conversion:
    national_references: ['eurostat', 'oecd', 'jmp']
    min_pe_per_resident: 0.75
  reference_labels:
    gb: 'GB catchments'
    nl: 'NL CBS'
    us: 'US sewersheds'
    hw: 'HydroWASTE reported'
    uwwtd: 'UWWTD capacity'
    hw_reported: 'HydroWASTE reported'
    cwns_2022: 'US CWNS 2022'
    uwwtd_load: 'UWWTD load'
    jmp: 'JMP'
    jmp_sewer: 'JMP (any sewer)'
    eurostat: 'Eurostat'
    oecd: 'OECD'
  error_axis_max: 6             # largest x-axis end of the typical-error dot plots (larger errors drawn at it)
  max_map_labels: 8             # label countries on a plant map only when it has at most this many
  # National references and the extent of their map
  national_references: {jmp: 'world', oecd: 'world', eurostat: 'europe'}
  min_units: 10                 # a country / size class with fewer reference plants stays grey
  # Typical error classes (factor) and colours (one more than bins): blues below x1.5 (good),
  # yellow to dark red above (poor); fine steps where most countries lie (x1.2-x2)
  error_bins: [1.2, 1.3, 1.4, 1.5, 1.75, 2, 3]
  error_colors: ['#313695', '#4575b4', '#74add1', '#abd9e9', '#fee090', '#fdae61', '#e8492e', '#a50026']
  # Ours minus the reference (percentage points): class edges and colours, red (ours lower) to
  # blue (ours higher) around a grey midpoint
  difference_bins_pp: [-20, -10, -5, 5, 10, 20]
  diverging_colors: ['#a32c2b', '#e34948', '#f2a19a', '#f0efec', '#9ec5f4', '#3987e5', '#184f95']
  share_colors: ['#e9f1fc', '#9ec5f4', '#3987e5', '#184f95', '#0d366b']
  nodata_color: '#dedede'
  map_crs: 'EPSG:8857'          # Equal Earth
  south_limit_deg: -58          # Antarctica left out
  europe_extent: [-11, 32, 35, 62]          # lon min, lon max, lat min, lat max
  europe_panel_ratio: [2.2, 1]  # widths of the world map and of Europe enlarged beside it
  width_mm: null
  font_family: null
  font_size_pt: null
  dpi: null
  colors: null
  heights_mm: {plants_map: 72, national_map_world: 100, national_map_europe: 150, regions_countries: 150, plants_countries_row: 3.2, plants_countries_panel: 18}
  paths:
    data_dir: null
    boundaries: '{data_dir}/boundaries/ne_110m_admin_0_countries.shp'
    output_dir: '{data_dir}/figures/validation'

# Snakemake (workflow/Snakefile): where it keeps its logs and stamp files, how
# many jobs split download_bing_annotate, and the SLURM resources of every
# stage's jobs (threads = CPUs per task, mem_mb, runtime in minutes). Every
# stage the workflow runs needs an entry. A cluster overlay can tune any of them.
workflow:
  bing_annotate_shards: 10
  # One-time stages: combine_locations, the image annotation (osm_planet, annotation_grids,
  # wastewater_join, download_bing_annotate, merge_annotations; all five:
  # 'annotations'; without the images: 'annotation_context' = osm_planet + annotation_grids +
  # wastewater_join; the text overlay: 'annotation_overlay' = download_bing_annotate)
  # download_pop, and the plant list v3 ('work_list' = national_plants + make_work_list;
