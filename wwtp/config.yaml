download_pop:
  start_year: 2015
  end_year: 2024
  worldpop_2014_url_template: 'https://data.worldpop.org/GIS/Population/Global_2000_2020_1km/2014/{country_upper}/{country_lower}_ppp_2014_1km_Aggregated.tif'
  worldpop_yearly_url_template: 'https://data.worldpop.org/GIS/Population/Global_2015_2030/R2024B/{year}/{country_upper}/v1/100m/constrained/{country_lower}_pop_{year}_CN_100m_R2024B_v1.tif'
  # 2014 is the 1 km unconstrained product, not comparable with the 100 m
  # constrained 2015-2024 series; off by default.
  include_2014: false
  # Debug aid: process only the first N countries in alphabetical order. 0 = all.
  country_limit: 0
  paths:
    data_dir: null
    pop_dir: '{data_dir}/population'

create_voronoi:
  level: null
  version: null
  buffer: 9000
  # 'size': each plant's Voronoi weight is sqrt(plant size in people), so at
  # equal density its area grows in proportion to its people. Needs weight_func
  # 'mult'. The other methods transform the detected area (create_weights).
  weight_method: 'size'
  weight_func: 'mult'
  dynamic_buffering: true
  # Plant size in people, used by the service radius and by weight_method 'size':
  #   reported  - the first positive value in reported_size_columns, the
  #               footprint estimate where there is none
  #   footprint - the footprint estimate for every plant (detections only)
  # GB catchments (not used for calibration), service-area / real population for
  # catchments of <10k, 10k-100k, 100k-500k, >500k people:
  #   reported  1.40, 1.09, 1.00, 1.01 (typical plant error x1.59)
  #   footprint 2.21, 1.35, 0.97, 0.67 (x1.82): the detected footprint of the
  #   largest plants is hardly larger than that of mid-size ones.
  # See notes/service_radius_size_rule_2026-11-05.md.
  size_measure: 'reported'
  max_workers: 16
  n_points: 100
  # Sites closer than this (m) are merged before the Voronoi run. Was
  # inherited from final_data_merge.threshold; same value, now explicit.
  threshold: 500
  sigma: 3
  percent_threshold: 10
  basin_column_name: 'HYBAS_ID'
  country_output_column: 'ISO_2'
  country_boundary_column: 'country'
  site_id_column: 'WASTE_ID'
  old_site_id_column: 'OLD_WASTE_ID'
  calculate_area_fn: 'calculate_area'
  calculate_buffer_fn: 'calculate_buffer'
  area_fn_kwargs: {}
  prepare_data_fn: 'prepare_data'
  # Skip-if-exists gate on the final Voronoi output path. Distinct from
  # temp_voronoi_overwrite below, which controls intra-op checkpoint files
  # written *during* a single run, not whether to redo a run whose final
  # output already exists.
  overwrite_existing: true
  temp_voronoi_overwrite: true
  flush_size: 1000
  # Largest service radius (m) in either mode: HydroFATE's largest
  # allocation distance (Ehalt Macedo et al. 2024, GMD 17:2877, supplement S.1).
  max_buffer: 50000
  # Columns holding a plant's reported size, in order of preference: HydroWASTE
  # people served, EPA CWNS 2022 people served (US), UWWTD load entering the
  # plant in population equivalents (EU; GB plants: POP_SERVED = 0.91 x load).
  reported_size_columns: ['POP_SERVED', 'EPA POP 2022', 'uwwLoadEnteringUWWTP']
  # Values skipped: HydroWASTE QUAL_POP 4 is POP_SERVED estimated as the people
  # within 11 km of the plant, not a record of the plant.
  reported_size_skip: {POP_SERVED: {QUAL_POP: [4]}}
  # Footprint estimate: log10 people = intercept + offset + slope * log10 footprint_m2,
  # footprint_m2 = detected tank circles + rectangles; intercept and slope fitted on the 24,505
  # plants with both a footprint and a reported size (R2 0.31).
  # country_offsets (log10): median of log10(reported / fit) over a country's plants with both,
  #   where it has at least 30 (32 countries; 0 elsewhere). Typical error of the estimate on these
  #   plants x2.19 -> x1.92 (held-out halves of each country: x2.20 -> x1.92). China +0.76 (x5.7),
  #   India +0.89 (x7.8), Mexico +0.48 (x3.0).
  # unsized_people: lagoon plants and plants without detections (median reported size of such
  #   plants, n 13,442; 45 % of them in the US, where lagoons are common).
  # unsized_people_by_country replaces it: the median reported size of the country's such plants
  #   where it has at least 30 (28 countries); otherwise 0.409 x the median footprint estimate of its
  #   plants with a footprint (at least 30; 29 countries; the ratio is the median over the 28; a
  #   left-out country's median is predicted within x1.44 by it, within x1.72 by one value for all).
  # From python -m wwtp.calibration.connection_radius calibrate (plant_size_countries.csv, run of
  # 13 Nov, the pipeline's own country join).
  footprint_to_people:
    intercept: 1.523
    slope: 0.7
    unsized_people: 2580
    country_offsets: {
      'AT': -0.102, 'BE': -0.140, 'BG': 0.023, 'BR': -0.175, 'CH': 0.194, 'CN': 0.757, 'CZ': -0.098,
      'DE': -0.075, 'DK': -0.391, 'EE': -0.360, 'ES': 0.181, 'FI': 0.156, 'FR': -0.075, 'GB': -0.242,
      'GR': 0.238, 'HR': 0.202, 'HU': 0.124, 'IE': 0.037, 'IN': 0.891, 'IT': 0.246, 'LT': -0.220,
      'LV': -0.392, 'MX': 0.476, 'NL': 0.088, 'NO': -0.077, 'PL': -0.064, 'PT': 0.252, 'RO': 0.195,
      'SE': 0.038, 'SK': -0.269, 'US': -0.180, 'ZA': -0.256
    }
    unsized_people_by_country: {
      'AR': 7527, 'AT': 3667, 'BE': 3186, 'BG': 19054, 'BR': 4954, 'BY': 12659, 'CA': 10245, 'CH': 1632,
      'CL': 5132, 'CN': 127500, 'CO': 4413, 'CZ': 2602, 'DE': 8374, 'DK': 5863, 'DZ': 8536, 'EE': 3811,
      'EG': 9053, 'ES': 4902, 'FI': 13350, 'FR': 4172, 'GB': 4034, 'GR': 4500, 'HR': 8152, 'HU': 1903,
      'IE': 4053, 'IL': 11487, 'IN': 40087, 'IQ': 6568, 'IR': 9423, 'IT': 2866, 'KR': 7936, 'KZ': 12808,
      'LT': 4685, 'LV': 2177, 'MA': 10437, 'MD': 9174, 'MX': 11181, 'MY': 8498, 'NL': 36566, 'NO': 3102,
      'PL': 3536, 'PT': 4200, 'RO': 13701, 'RU': 10133, 'SA': 8513, 'SE': 4623, 'SK': 1754, 'TH': 23734,
      'TN': 10777, 'TR': 6215, 'TW': 5137, 'UA': 8922, 'US': 1182, 'UZ': 14462, 'VN': 11919, 'ZA': 2286,
      'ZW': 5461
    }
  # Factor on every plant size of a country (reported or estimated), per size_measure:
  #   k = connected people (connected_share x people of the 2022 raster) / sum of its plant sizes,
  #   kept within 0.1 and 10; countries without an entry: 1.
  # Reported sizes are partly population equivalents (industry included) and our plant list is
  # incomplete or over-complete by country; with k the sizes of a country add up to the people JMP
  # counts as connected (raw k: median 1.74; US 1.16, GB 0.95, NL 0.93, China 1.19, India 0.34,
  # Thailand 0.04, Türkiye 5.2). A factor k is a factor k ** radius_exponent on the radius.
  # Chosen with the radius rule below (wwtp.calibration.connection_radius calibrate, run of 13 Nov:
  # limits calibration_size_scale_limits x caps): the smallest national error, leaving one SDG region
  # out, among the pairs that keep the mean plant-level error on the US sewersheds, GB catchments and
  # NL CBS plants at or below that of the fixed radius with the same sizes. reported: 10.1 -> 7.5 pp
  # (people-weighted 7.5 -> 5.3), plants x1.440 against x1.445. footprint: every pair with a scale
  # raises the plant-level error (x1.50-1.62 against x1.457), so none.
  # notes/size_calibration_2026-11-12.md.
  size_scale:
    reported: {
      'AE': 10.00, 'AF': 2.91, 'AL': 1.99, 'AM': 0.10, 'AT': 0.59, 'AZ': 10.00, 'BA': 3.88, 'BD': 0.10,
      'BE': 1.19, 'BF': 0.53, 'BG': 0.86, 'BH': 10.00, 'BR': 1.56, 'BT': 1.60, 'BW': 0.10, 'BY': 0.53,
      'BZ': 0.16, 'CA': 0.45, 'CD': 6.90, 'CH': 0.83, 'CI': 10.00, 'CL': 10.00, 'CN': 1.19, 'CO': 2.39,
      'CR': 3.91, 'CU': 7.45, 'CV': 0.11, 'CY': 0.84, 'CZ': 0.85, 'DE': 0.74, 'DK': 0.79, 'DO': 9.43,
      'DZ': 6.61, 'EC': 10.00, 'EE': 1.01, 'EG': 3.85, 'ES': 0.67, 'ET': 1.80, 'FI': 0.81, 'FJ': 4.30,
      'FR': 0.73, 'GB': 0.95, 'GE': 10.00, 'GH': 2.19, 'GM': 0.33, 'GR': 0.70, 'HR': 0.74, 'HU': 0.75,
      'IE': 1.44, 'IL': 4.23, 'IN': 0.34, 'IQ': 2.86, 'IR': 3.50, 'IT': 0.67, 'JM': 4.26, 'JO': 6.50,
      'KE': 1.93, 'KG': 4.09, 'KH': 6.19, 'KN': 0.33, 'KR': 10.00, 'KW': 10.00, 'KZ': 2.23, 'LA': 0.15,
      'LB': 6.38, 'LS': 0.10, 'LT': 0.97, 'LU': 0.89, 'LV': 1.27, 'LY': 2.81, 'MA': 2.63, 'MD': 0.73,
      'ME': 1.11, 'MG': 10.00, 'MK': 0.79, 'ML': 10.00, 'MM': 0.62, 'MN': 6.35, 'MT': 0.59, 'MU': 4.00,
      'MX': 2.22, 'MY': 2.22, 'MZ': 6.45, 'NE': 1.54, 'NG': 10.00, 'NL': 0.93, 'NO': 0.62, 'NP': 0.10,
      'OM': 2.85, 'PA': 10.00, 'PE': 1.15, 'PG': 10.00, 'PH': 6.50, 'PL': 0.73, 'PT': 0.71, 'PY': 1.08,
      'QA': 7.67, 'RO': 1.02, 'RS': 1.69, 'RU': 1.80, 'SA': 7.04, 'SE': 0.84, 'SG': 10.00, 'SI': 10.00,
      'SK': 0.96, 'SL': 5.57, 'SN': 4.67, 'SV': 3.36, 'SZ': 0.99, 'TD': 5.24, 'TG': 1.59, 'TH': 0.10,
      'TN': 5.56, 'TO': 0.10, 'TR': 5.24, 'TT': 9.29, 'TZ': 5.02, 'UA': 2.21, 'UG': 0.66, 'US': 1.16,
      'UZ': 1.90, 'VE': 10.00, 'VN': 1.65, 'YE': 10.00, 'ZA': 1.25, 'ZW': 0.46
    }
    footprint: {}
  # Service radius (dynamic_buffering: true), per size_measure:
  #   radius_km = radius_at_10k_people_km * (people / 10000) ** radius_exponent,
  #   at most max_buffer
  # Chosen on 2020 census block-group population in the 444 EPA sourced
  # sewersheds of CT, KY, MA, NH, RI, UT and VT matched to our plants, with the
  # same rule (sqrt(people) weights, circle): among the pairs whose total stays
  # within 10 % of the census total, the one with the smallest typical error
  # averaged over the size classes <10k, 10k-100k and >100k people, so that large
  # plants count as much as small ones. US result (reported): typical error x1.38
  # per class, 74 % of plants within a factor 2, total 0.99. GB catchments: not
  # used.
  # Regenerate with: python -m wwtp.calibration.service_radius --help
  radius_calibration:
    reported:
      radius_exponent: 0.3
      radius_at_10k_people_km: 3.75
      by_connection: {intercept: 1.367, slope: 0.182, max_km: 5.5}
    footprint:
      radius_exponent: 0.5
      radius_at_10k_people_km: 4.25
      by_connection: {intercept: 1.197, slope: 0.137, max_km: 4.0}
  # The radius at 10,000 people by country (by_connection; without it radius_at_10k_people_km everywhere):
  #   r10k_km = min(max_km, exp(intercept + slope * logit(C))), C = connected_share of the plant's
  #   country; countries without a value keep radius_at_10k_people_km.
  # Calibrated on 126 countries (wwtp.calibration.connection_radius calibrate, run of 13 Nov): the
