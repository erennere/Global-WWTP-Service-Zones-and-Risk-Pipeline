  # size_scale. notes/size_calibration_2026-11-12.md.
  # Share of people whose sewage reaches treatment (JMP household file, san_sew_sm_t, value of the
  # year nearest 2022; ISO 3166 alpha-2).
  connected_share: {
    'AD': 1.000, 'AE': 0.926, 'AF': 0.012, 'AL': 0.338, 'AM': 0.000, 'AS': 0.310, 'AT': 0.926, 'AU': 0.925,
