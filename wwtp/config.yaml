    #annotations_results_filepath: '/mnt/sds-hd/sd17f001/sukanya/wtp_seg/2026_global/annotated/mm/inference/csv_files/chunk_1/i2t_res1.csv'
    annotations_results_filepath: '/mnt/sds-hd/sd17f001/sukanya/wtp_seg/2026_global/annotated/mm/inference/output/inference/csv_files/chunk_1/i2t_res1.csv'
