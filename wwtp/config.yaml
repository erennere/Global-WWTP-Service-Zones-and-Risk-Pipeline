# The sensitivity grid. `snakemake sweep` (workflow/Snakefile) builds the service
# areas and population layers of every combination (wwtp.workflow.sweep_variants);
# sweep_validation scores them and chooses one. Each level needs its
# basin file from combine_watersheds. Without distance weighting (weight_func '')
# only 'linear' runs, and 'size' weights only run with 'mult'; 'add' is available.
sweep:
  sweep_levels: [5, 6, 7]
  sweep_weight_funcs: ['mult', '']
  sweep_weight_methods: ['size', 'linear', 'logarithmic', 'square_root', 'sigmoid']
  sweep_rigid_buffers: [9000, 11000, 13000, 15000]
  sweep_size_measures: ['reported', 'footprint']

# Validation of the sweep and the choice of a candidate (variant x approach; approach 0 once):
# wwtp/sensitivity_analysis_scripts/sweep_validation.py. Two levels:
#   plants    - people per plant against real catchments (gb: Hoffmann et al., population raster;
#               nl: CBS per RWZI), the EPA sewersheds the radius was calibrated on (us), HydroWASTE
#               reported and UWWTD capacity (inputs of variants with reported sizes); groups ver /
#               unver / single fixed on the configured variant's basins.
#   countries - people in service areas / people of the country's raster against the share connected
#               to treatment (JMP, Eurostat, OECD; JMP sewer connection as upper bound), per country
#               and SDG region.
sweep_validation:
  country_output_column: null
  basin_column_name: null
  max_workers: 16
  threshold: null              # UWWTD match distance (m), as eu_comparison
  eu_reference_factor: null    # as eu_comparison
  percent_verification: null   # as verification_script
  # Population year of each plant reference (the candidates' <year>_zonal_sum; gb also its raster).
  reference_years: {gb: 2024, nl: 2024, us: 2020, hw: 2024, uwwtd: 2024}
  gb_match_distance_m: 1000    # our plant to the UWWTD plant of a linked GB catchment
  us_match_distance_m: 500     # our plant to its EPA sewershed polygon
  # Countries: population year of the shares (JMP's latest is 2022), reference values at most this
  # many years away, countries with at least this many plants (as the figures).
  national_year: 2022
  national_max_year_gap: 5
  national_min_plants: 5
  national_series: {jmp: 'san_sew_sm_t', jmp_sewer: 'san_sew_t', eurostat: 'URB_OTH_CS', oecd: 'PUBTOTTR'}
  eurostat_geo_aliases: {EL: 'GR', UK: 'GB'}   # Eurostat country codes that are not ISO 3166
  # The choice: each component's error relative to the configured candidate, weighted. Half plants
  # (GB, NL), half countries (JMP, global). The best candidate replaces the configured one only if it
  # is better overall and worse in no component, both at this confidence (paired bootstrap).
  decision_weights: {gb: 0.25, nl: 0.25, jmp: 0.5}
  bootstrap_samples: 1000
  bootstrap_seed: 0
  confidence: 0.95
  paths:
    data_dir: null
    pop_tif_dir: null
    eu_ref_filepath: null
    gb_catchments: '{data_dir}/validation_data/gbr_catchments/catchments_consolidated.zip'
    gb_waterbase_lookup: '{data_dir}/validation_data/gbr_catchments/waterbase_catchment_lookup.csv'
    gb_waterbase: '{data_dir}/validation_data/gbr_catchments/waterbase_consolidated.csv'
    nl_cbs: '{data_dir}/validation_data/nld_cbs_rwzi/2025-Aantal-inwoners-per-RWZI-verzorgingsgebied-1-jan-2024.xlsx'
    us_sewersheds: '{data_dir}/validation_data/usa_epa_sewersheds/Current_Release.zip'
    jmp: '{data_dir}/validation_data/jmp_household/jmp_household.xlsx'
    eurostat: '{data_dir}/validation_data/eu_eurostat/eurostat_env_ww_con.tsv'
    oecd: '{data_dir}/validation_data/oecd_water_treat/oecd_water_treat.csv'
    output_dir: '{data_dir}/sensitivity/sweep_validation'

# Reference data for the validation and national plant registers
# (wwtp/pop_validation_scripts/national_data.py): `fetch` downloads every file below into
# <validation_dir>/<source>/ (needs internet; kept if already there), `registers` describes the files
# (peek.md) and lists the register plants our list lacks (new_plants.gpkg, one file for all countries).
# kind: http (one GET), ogcapi (OGC API Features collection .../items), arcgis (ArcGIS REST layer).
# required: the sweep validation reads these; a failed download stops the run. The others are only
# recorded in manifest.json. Addresses marked 'not checked' were not opened when they were added.
national_data:
  version: null
  request_timeout_seconds: 600
  # Sent with every download: some portals (Brazil's ANA) refuse the default python-requests agent.
  request_headers: {User-Agent: 'Mozilla/5.0 (compatible; wwtp-validation/1.0)'}
  page_size: 1000
  peek_rows: 3
  # A register plant farther than this from every plant of ours counts as new.
  match_distance_m: 1000
  # Coordinate columns of register tables: the first column whose name contains one of these.
  coordinate_names: {lon: ['longitude', 'long', 'lon'], lat: ['latitude', 'lat']}
  sources:
    gbr_catchments:   # Hoffmann et al., release norm-intersection-sum
      required: true
      peek: false
      files:
        catchments_consolidated.zip: {kind: http, url: 'https://github.com/tillahoffmann/wastewater-catchment-areas/releases/download/norm-intersection-sum/catchments_consolidated.zip'}
        waterbase_catchment_lookup.csv: {kind: http, url: 'https://github.com/tillahoffmann/wastewater-catchment-areas/releases/download/norm-intersection-sum/waterbase_catchment_lookup.csv'}
        waterbase_consolidated.csv: {kind: http, url: 'https://github.com/tillahoffmann/wastewater-catchment-areas/releases/download/norm-intersection-sum/waterbase_consolidated.csv'}
    usa_epa_sewersheds:   # EPA National Sewershed Dataset (git LFS file)
      required: true
      peek: false
      files:
        Current_Release.zip: {kind: http, url: 'https://media.githubusercontent.com/media/USEPA/Sewersheds/main/Current_Release.zip'}
    nld_cbs_rwzi:   # CBS inhabitants per RWZI catchment, 1 Jan 2024
      required: true
      peek: false
      files:
        2025-Aantal-inwoners-per-RWZI-verzorgingsgebied-1-jan-2024.xlsx: {kind: http, url: 'https://www.cbs.nl/-/media/_excel/2025/04/2025-aantal-inwoners-per-rwzi-verzorgingsgebied-1-jan-2024.xlsx'}
    jmp_household:
      required: true
      peek: false
      files:
        jmp_household.xlsx: {kind: http, url: 'https://washdata.org/data/country/WLD/household/download'}
    eu_eurostat:
      required: true
      peek: false
      files:
        eurostat_env_ww_con.tsv: {kind: http, url: 'https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/env_ww_con?format=TSV'}
    oecd_water_treat:
      required: true
      peek: false
      files:
        oecd_water_treat.csv: {kind: http, url: 'https://sdmx.oecd.org/public/rest/data/OECD.ENV.EPI,DSD_WATER_TREAT@DF_WATER_TREAT,1.0/all?format=csvfilewithlabels'}
    sdg_631:   # WHO / UN-Habitat domestic wastewater safely treated, 2025 summary of the country files
      required: false
      peek: true
      files:
        who_2025_sdg631_domestic_wastewater_summary.xlsx: {kind: http, url: 'https://cdn.who.int/media/docs/default-source/wash-documents/wash-coverage/2025-sdg-631-files/who-2025-sdg-631-domestic-wastewater-summary-rev.xlsx'}
    unsd_wastewater:   # UNSD environmental indicators, population connected to treatment (not checked)
      required: false
      peek: true
      files:
        WasteWater2011_dwnl.xls: {kind: http, url: 'https://unstats.un.org/unsd/environment/excel_file_tables/2010/WasteWater2011_dwnl.xls'}
    nld_zuiveringseenheid:   # treatment units of all water boards (polygons with their RWZI)
      required: false
      peek: true
      files:
        zuiveringseenheid.geojson: {kind: ogcapi, url: 'https://api.pdok.nl/rioned/waterschappen-waterketen-gwsw/ogc/v1_0/collections/waterschap_zuiveringseenheid/items'}
    irl_epa_agglomerations:   # EPA Ireland agglomeration boundaries (WFS)
      required: false
      peek: true
      files:
        uww_agglomeration_boundaries.geojson: {kind: http, url: 'http://gis.epa.ie/geoserver/EPA/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=EPA:UWW_AgglomerationBoundaries&outputFormat=application%2Fjson&srsName=EPSG:4326'}
    esp_miteco_agglomerations:   # MITECO aglomeraciones urbanas Q2023
      required: false
      peek: true
      files:
        aauuq2023.zip: {kind: http, url: 'https://www.mapama.gob.es/app/descargas/descargafichero.aspx?f=aauuq2023.zip'}
    bra_ana_atlas_esgotos:   # ANA Atlas Esgotos: plants 2019, municipal table, field dictionary
      required: false
      peek: true
      files:
        Estacao_Tratamento_Esgoto_2019.zip: {kind: http, url: 'https://metadados.snirh.gov.br/geonetwork/srv/api/records/1d8cea87-3d7b-49ff-86b8-966d96c9eb01/attachments/Estacao_Tratamento_Esgoto_2019.zip'}
        ATLAS_Esgotos_Tabela_ETEs_2019.xlsx: {kind: http, url: 'https://metadados.snirh.gov.br/geonetwork/srv/api/records/1d8cea87-3d7b-49ff-86b8-966d96c9eb01/attachments/ATLAS_Esgotos_Tabela_ETEs_2019.xlsx'}
        ATLAS_Esgotos_Tabela_Completa_por_Municipio.xlsx: {kind: http, url: 'https://metadados.snirh.gov.br/geonetwork/srv/api/records/1d8cea87-3d7b-49ff-86b8-966d96c9eb01/attachments/ATLAS_Esgotos_Tabela_Completa_por_Municipio.xlsx'}
        Dicionario_Informacoes_ATLAS_Esgotos.xlsx: {kind: http, url: 'https://metadados.snirh.gov.br/geonetwork/srv/api/records/1d8cea87-3d7b-49ff-86b8-966d96c9eb01/attachments/Dicionario_Informacoes_ATLAS_Esgotos.xlsx'}
    can_eccc_wser:   # Wastewater Systems Effluent Regulations reported data
      required: false
      peek: true
      files:
        Resaeu-Wser-identification.csv: {kind: http, url: 'https://data-donnees.az.ec.gc.ca/api/file?path=%2Fsubstances%2Fplaninfrastruture%2Fwastewater-systems-effluent-regulations-reported-data%2FResaeu-Wser-identification.csv'}
        Resaeu-Wser-data-dictionary.csv: {kind: http, url: 'https://data-donnees.az.ec.gc.ca/api/file?path=%2Fsubstances%2Fplaninfrastruture%2Fwastewater-systems-effluent-regulations-reported-data%2FResaeu-Wser-dictionnaire-des-donnees-data-dictionary.csv'}
    aus_ga_wwtf:   # Geoscience Australia National Wastewater Treatment Facilities
      required: false
      peek: true
      files:
        wastewater_treatment_facilities.geojson: {kind: arcgis, url: 'https://services.ga.gov.au/gis/rest/services/Wastewater_Treatment_Facilities/MapServer/0'}
    jpn_mlit_p22:   # MLIT 国土数値情報 下水道関連施設 (non-commercial terms; address not checked)
      required: false
      peek: true
      files:
        P22-12_GML.zip: {kind: http, url: 'https://nlftp.mlit.go.jp/ksj/gml/data/P22/P22-12/P22-12_GML.zip'}
    mex_inegi_iter_2020:   # Censo 2020, results by locality (address not checked)
      required: false
      peek: true
      files:
        iter_00_cpv2020_csv.zip: {kind: http, url: 'https://www.inegi.org.mx/contenidos/programas/ccpv/2020/datosabiertos/iter/iter_00_cpv2020_csv.zip'}
  # Plant registers: every point (or the representative point) of the file is a plant. encoding: of a
  # CSV register (read as text); other files carry their own.
  registers:
    bra_ana_2019: {source: 'bra_ana_atlas_esgotos', file: 'Estacao_Tratamento_Esgoto_2019.zip', iso2: 'BR', year: 2019, encoding: 'utf-8'}
    can_wser: {source: 'can_eccc_wser', file: 'Resaeu-Wser-identification.csv', iso2: 'CA', year: 2025, encoding: 'cp1252'}
    aus_ga: {source: 'aus_ga_wwtf', file: 'wastewater_treatment_facilities.geojson', iso2: 'AU', year: 2012, encoding: 'utf-8'}
    jpn_p22: {source: 'jpn_mlit_p22', file: 'P22-12_GML.zip', iso2: 'JP', year: 2012, encoding: 'utf-8'}
  # new_plants.gpkg / .csv: every plant our list lacks, without size, not merged into the plant list
  # (the model runs on them first): register plants farther than match_distance_m from all of ours,
  # and in the countries our list does not cover (no HeiGIT detections) also their HydroWASTE records;
  # a HydroWASTE record within match_distance_m of a register plant is the same plant.
  uncovered:
    countries: ['AU', 'JP', 'NZ']
    hydrowaste_columns: {id: 'WASTE_ID', name: 'WWTP_NAME', country: 'CNTRY_ISO', lon: 'LON_WWTP', lat: 'LAT_WWTP'}
  paths:
    data_dir: null
    annotated_all_filepath: null
    validation_dir: '{data_dir}/validation_data'
    hydrowaste: null
    output_dir: '{data_dir}/validation_data/national_data'

# Calibration on national statistics (wwtp/calibration/connection_radius.py; Snakemake target
# `calibration`). For every country with plants and a WorldPop raster: the share of its people inside
# service areas as a function of radius_at_10k_people_km, with the stand-in of
# wwtp/calibration/service_radius.py (each person goes to the plant with the smallest distance /
# sqrt(people) among its candidate_plants nearest, kept inside that plant's circle, at most max_buffer).
# From those curves and the national connection statistics (reference_urls), `calibrate` derives the
# national size scale and the radius rule r10k = min(cap, exp(a + b logit(connected share))), and from
# our plants the country parts of the plant size. Its tables are the source of create_voronoi's
# footprint_to_people, size_scale and radius_calibration.*.by_connection; nothing is written to config.
connection_radius:
  version: null
  year: 2022                  # WorldPop raster year (download_pop keeps 2015-2024)
  aggregate_cells: 10         # 100 m cells summed to 1 km
  candidate_plants: 64
  size_measures: ['reported', 'footprint']
  radius_exponents: [0.3, 0.5]
  # radius_at_10k_people_km grid: count values, geometric from start to stop (km)
  radius_grid: {start: 0.5, stop: 40.0, count: 40}
  max_workers: 16
  max_buffer: null
  footprint_to_people: null
  reported_size_columns: null
  reported_size_skip: null
  country_output_column: null
  country_boundary_column: null
  # National connection statistics, saved unparsed: JMP household world file (sewer connections,
  # wastewater treated), Eurostat population connected to wastewater treatment, OECD wastewater
  # treatment. Downloaded on the machine that runs Snakemake (compute nodes may have no internet).
  reference_urls:
    jmp_household.xlsx: 'https://washdata.org/data/country/WLD/household/download'
    eurostat_env_ww_con.tsv: 'https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/env_ww_con?format=TSV'
    oecd_water_treat.csv: 'https://sdmx.oecd.org/public/rest/data/OECD.ENV.EPI,DSD_WATER_TREAT@DF_WATER_TREAT,1.0/all?format=csvfilewithlabels'
  request_timeout_seconds: 120
  # The share of people connected to wastewater treatment, per source, in the year nearest `year`:
  # JMP "safely managed via sewer" (sewer connections whose wastewater is treated; sheet 'san'),
  # Eurostat 'connected to urban and other wastewater treatment' (ww_tp URB_OTH_CS, unit PC), OECD
  # 'public total treatment' (PUBTOTTR). fit_reference is fitted and scored; the others are checks.
  reference_files: {jmp: 'jmp_household.xlsx', eurostat: 'eurostat_env_ww_con.tsv', oecd: 'oecd_water_treat.csv'}
  reference_series: {jmp: 'san_sew_sm_t', eurostat: 'URB_OTH_CS', oecd: 'PUBTOTTR'}
  eurostat_geo_aliases: {EL: 'GR', UK: 'GB'}   # Eurostat country codes that are not ISO 3166
  reference_max_year_gap: 5   # per country the value of the year nearest `year`; dropped if further away
  fit_reference: 'jmp'
  # Fit (light; runs anywhere): log r10k = a + b logit(predictor), cross-validated over countries.
  # Predictors: 'reference' (the connected share itself) and 'reported_coverage' (sum of our plants'
  # reported sizes / national population: our data only, so the reference stays a pure check).
  fit_predictors: ['reference', 'reported_coverage']
  fit_folds: 5
  fit_seed: 0
  # calibrate: caps (km) of r10k = min(cap, exp(a + b logit(C))) to tabulate, each tested by leaving one
  # SDG region out with every pair of size-scale limits; the pair (limits, cap) is then chosen with the
  # plant-level check (create_voronoi.size_scale; notes/size_calibration_2026-11-12.md).
  calibration_caps_km: [3.0, 3.5, 4.0, 4.5, 5.0, 5.25, 5.5, 5.75, 6.0, 6.5, 7.0, 8.0, 40.0]
  # Limits of the national size scale (create_voronoi.size_scale) that calibrate tests with every cap;
  # min 1 and max 1 = no scale.
  calibration_size_scale_limits: [{min: 1, max: 1}, {min: 0.3333, max: 3}, {min: 0.2, max: 5}, {min: 0.1, max: 10}]
  # Fewest plants a country value of the plant size rests on (footprint_to_people.country_offsets,
  # unsized_people_by_country).
  size_country_min_plants: 30
  # calibrate: the same served shares (leaving one region out) also against these national references,
  # which are not fitted. SDG 6.3.1 (WHO / UN-Habitat 2025 summary, downloaded by national_data):
  # household wastewater volume in sewers / total household volume x share of the sewer flow
  # delivered to treatment = share of people whose sewage reaches treatment through a sewer.
  check_references: ['sdg631', 'eurostat', 'oecd']
  sdg631:
    sheet: 'Countries'
    iso3: 'Country ID (iso3)'
    total_volume: 'Volume of wastewater generated, Household, Total'
    sewer_volume: 'Volume of wastewater generated, Household, Sewers'
    sewer_delivered_percent: 'Proportion of wastewater flow delivered to treatment, Household, Sewers'
    year: 2022
  # plant_check (wwtp/calibration/plant_check.py): every calibrate configuration where the real
  # catchments are known. Built-in references (paths of the sweep_validation section) and polygon
  # files of real catchments downloaded by national_data (folder, file, country). A reference whose
  # file is missing is listed in plant_check_status.csv and left out.
  plant_reference_kinds: ['us_sewersheds', 'gb_catchments', 'nl_cbs']
  # Polygons: every polygon layer of the files in the source folder.
  plant_reference_polygons:
    nl_units: {iso2: 'NL', source: 'nld_zuiveringseenheid'}
    ie_agglomerations: {iso2: 'IE', source: 'irl_epa_agglomerations'}
    es_agglomerations: {iso2: 'ES', source: 'esp_miteco_agglomerations'}
  # Our plant to a polygon of plant_reference_polygons (outfall plants often lie just outside).
  polygon_match_distance_m: 1000
  # Census localities: served share by municipality against the share of dwellings with drainage
  # (public sewer or septic tank, so an upper bound). Reported, not used in the choice.
  district_references:
    mx_iter_2020:
      iso2: 'MX'
      source: 'mex_inegi_iter_2020'
      file: 'iter_00_cpv2020_csv.zip'
      member: 'iter_00_cpv2020/conjunto_de_datos/conjunto_de_datos_iter_00CSV20.csv'
      columns: {state: 'ENTIDAD', municipality: 'MUN', locality: 'LOC', lon: 'LONGITUD', lat: 'LATITUD', people: 'POBTOT', dwellings: 'VIVPAR_HAB', drainage: 'VPH_DRENAJ'}
      aggregate_localities: ['0000', '9998', '9999']   # totals and grouped small localities
      total_municipality: '000'
  # The choice: national error = mean of these (jmp: leaving one SDG region out; the others: the same
  # served shares against that reference), among the configurations whose plant-level error is not
  # above the fixed radius's.
  choice_national: ['jmp', 'sdg631']
  # "Not above the fixed radius's" is tested by a paired bootstrap over the reference units (drawn
  # within their size class): a configuration is excluded when it is worse in at least plant_confidence
  # of the samples. The plant-level errors of the configurations differ by less than their noise, so a
  # plain comparison would choose by chance (run of 13 Nov).
  plant_bootstrap_samples: 1000
  plant_bootstrap_seed: 0
  plant_confidence: 0.95
  paths:
    data_dir: null
    annotated_all_filepath: null
    overture: null
    overture_s3_url: null
    pop_tif_dir: null
    validation_dir: null
    sdg631: '{data_dir}/validation_data/sdg_631/who_2025_sdg631_domestic_wastewater_summary.xlsx'
    output_dir: '{data_dir}/calibration/connection_radius'

# Figure 1 (figures/fig1/): HeiGIT vs reference plants per country / HydroBASINS
# unit, and the served-population cartogram. Scripts read these through
# figures/fig1/fig1_config.py; their outputs and inputs live under data_dir.
figure1:
  # Units with fewer matched plants than this are hatched instead of coloured.
  min_plants: 5
  # A HeiGIT and a reference plant closer than this are the same plant.
  match_radius_m: 10000
  paths:
    data_dir: null
    match_dir: '{data_dir}/figures/fig1/match'
    cartogram_dir: '{data_dir}/figures/fig1/cartogram'
    combined_dir: '{data_dir}/figures/fig1/combined'
    # HeiGIT plants with their attributes, read by fid (the tanks panel: plant types)
    heigit_attrs: '{data_dir}/figures/fig1/match/data/HeiGIT_WWTP_LVL9_BFK0_8_LOG_MULT.gpkg'
    # HydroBASINS v1c: hybas_lev03/04_v1c.gpkg, hybas_lev08/09_v1c_attributes.csv
    hydrobasins_dir: '{data_dir}/figures/fig1/hydrobasins'

# Snakemake (workflow/Snakefile): where it keeps its logs and stamp files, how
# many jobs split download_bing_annotate, and the SLURM resources of every
# stage's jobs (threads = CPUs per task, mem_mb, runtime in minutes). Every
# stage the workflow runs needs an entry. A cluster overlay can tune any of them.
workflow:
  bing_annotate_shards: 10
  # One-time stages: combine_locations, the image annotation (annotation_grids,
  # wastewater_join, download_bing_annotate, merge_annotations; all four:
  # 'annotations') and download_pop. A run takes their outputs as they are and
  # never schedules them, unless they are listed here or named for one run:
  #   snakemake analysis --config run_once=annotations,download_pop   (targets before --config)
  # Their outputs must then exist (all_annotated_v2.gpkg, the download_pop stamp).
  run_once: []
  resources:
    combine_locations: {threads: 4, mem_mb: 65536, runtime: 2880}
    annotation_grids: {threads: 16, mem_mb: 131072, runtime: 2880}
    download_bing_annotate: {threads: 64, mem_mb: 239616, runtime: 2880}
    wastewater_join: {threads: 16, mem_mb: 65536, runtime: 2880}
    merge_annotations: {threads: 2, mem_mb: 4096, runtime: 2880}
    download_pop: {threads: 16, mem_mb: 65536, runtime: 5760}
    combine_watersheds: {threads: 4, mem_mb: 32768, runtime: 1440}
    create_voronoi: {threads: 16, mem_mb: 196608, runtime: 2880}
    add_pop: {threads: 8, mem_mb: 196608, runtime: 1440}
    create_rasters: {threads: 16, mem_mb: 196608, runtime: 2880}
    find_unserved_pop: {threads: 8, mem_mb: 32768, runtime: 2880}
    assign_rivers_to_basin: {threads: 16, mem_mb: 65536, runtime: 2880}
    find_intersection_river: {threads: 32, mem_mb: 131072, runtime: 2880}
    impact_polygons_pop: {threads: 64, mem_mb: 239616, runtime: 5760}
    find_diff_pop: {threads: 64, mem_mb: 239616, runtime: 5760}
    find_pop_in_danger_pop: {threads: 16, mem_mb: 32768, runtime: 5760}
    download_and_vectorize: {threads: 16, mem_mb: 65536, runtime: 5760}
    find_unconnected_industrial_areas: {threads: 16, mem_mb: 65536, runtime: 5760}
    verification_script: {threads: 4, mem_mb: 16384, runtime: 1440}
    hw_comparison: {threads: 4, mem_mb: 16384, runtime: 1440}
    eu_comparison: {threads: 4, mem_mb: 16384, runtime: 1440}
    piechart_figure: {threads: 4, mem_mb: 8192, runtime: 1440}
    piechart_interactive: {threads: 4, mem_mb: 8192, runtime: 1440}
    sizes_interactive_map: {threads: 4, mem_mb: 8192, runtime: 1440}
    composite_area_population_plots: {threads: 4, mem_mb: 8192, runtime: 1440}
    pop_at_risk_figures: {threads: 8, mem_mb: 8192, runtime: 1440}
    interactive_unconnected_industrial_map: {threads: 2, mem_mb: 4096, runtime: 120}
    national_registers: {threads: 2, mem_mb: 16384, runtime: 240}
    sweep_validation_references: {threads: 16, mem_mb: 65536, runtime: 720}
    sweep_validation: {threads: 16, mem_mb: 131072, runtime: 1440}
    connection_radius_curves: {threads: 16, mem_mb: 196608, runtime: 2880}
    connection_radius_plant_check: {threads: 16, mem_mb: 196608, runtime: 1440}
  paths:
    data_dir: null
    log_dir: '{data_dir}/workflow/logs'
    stamp_dir: '{data_dir}/workflow/stamps'
