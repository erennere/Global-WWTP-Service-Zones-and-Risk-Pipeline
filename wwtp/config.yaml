# Section order below follows the canonical workflow derived from the repo wrappers and READMEs.
# Put a shared parameter on the first script that actually consumes it.
# Later scripts inherit that value by setting the field to null.
# A later concrete value overrides only that script.
# CLI overrides take precedence over all resolved config values.
correct_locations_w_OSM:
  # The plant list every stage works on (all_annotated_v{version}.gpkg) and the v{version} of their output
  # paths. Set here, on the first section: a version set on a later section changes only that section (a
  # null takes the first section's value), so create_voronoi.version '3' alone left add_pop, national_data
  # and the calibration (connection_radius) on v2. '3': plants_v3's list (Eren, 20 Nov 2026). The stages
  # that built v2 (combine_locations, merge_seg_results, final_data_merge, merge_annotations) are not
  # for v3, whose list plants_v3 builds from all_annotated_v2 (its paths name v2 themselves).
  version: '3'
  rad: 5000
  # Explicit values (not null) because this is the first config section, so
  # there is no earlier canonical section to inherit from. create_voronoi's
  # matching keys (country_output_column/country_boundary_column) are the
  # section later scripts inherit these from via null.
  country_output_column: 'ISO_2'
  country_boundary_column: 'country'
  paths:
    data_dir: '../data'
    corrected_south: '{data_dir}/corrected_WWTP_enhanced_v{version}.geojson'
    osmgeo_filepath: '{data_dir}/wastewater_plant.geojson'
    paul_corrected_filepath: '{data_dir}/Enhanced_HW_WWTP__jun20_2025.geojson'
    overture: '{data_dir}/overture_maps_countries.parquet'
    overture_s3_url: 's3://overturemaps-us-west-2/release/2025-01-22.0/theme=divisions/type=division_area/*'

# Run manifests (wwtp/provenance.py): every stage writes one YAML per run with
# the resolved config, git commit, package versions and input fingerprints.
run_manifest:
  # Inputs up to this size get a SHA-256; larger ones only size and time.
  hash_max_mb: 200
  paths:
    data_dir: null
    manifest_dir: '{data_dir}/run_manifests'

merge_seg_results:
  version: null
  paths:
    data_dir: null
    corrected_south: null
    seg_corrected_south: '{data_dir}/seg_corrected_WWTP_enhanced_v{version}.gpkg'
    corrected_all_filepath: '{data_dir}/all_merged_v{version}.gpkg'
    dl_dir: '{data_dir}/DL_results'
    dl_zipfile: '{data_dir}/DL_results/csvv2-2.zip'
    dl_mapfile: '{data_dir}/DL_results/aftersort.geojson'
    seg_results_filepath: '/mnt/sds-hd/sd17f001/sukanya/wtp_seg/2026_global/Images_z17_512/results/csv/segoutput.csv'

final_data_merge:
  version: null
  threshold: 500
  osm_threshold: 1000
  paths:
    data_dir: null
    corrected_south: null
    seg_corrected_south: null
    corrected_all_filepath: null
    canada_filepath: '{data_dir}/extra_points/Canada_14_03_2025.csv'
    germany_filepath: '{data_dir}/extra_points/Germany_Hydra_waste_geospatial_corrected.geojson'
    osmgeo_filepath: null
    us_new_filepath: '{data_dir}/final_data_source/final_USA_WWT_dec3.geojson'
    eu_new_filepath: '{data_dir}/final_data_source/final_W_europe_WWT_dec3.geojson'
    thailand_filepath: '{data_dir}/final_data_source/Thailand_500m_merged.geojson'

combine_watersheds:
  # HydroBASINS level of the basins that bound the service areas (approach 1):
  # higher numbers = smaller basins. Level 6 (median ~5,600 km2 in GB) lets a
  # city's service area cross the small level-8 basins its sewers cross.
  level: '6'
  paths:
    data_dir: null
    watersheds_zip_dir: '{data_dir}/hydroshed_river_levels/lvl{level}'
    watershed: '{data_dir}/hydroshed_river_levels/hydrobase_lvl{level}_combined.gpkg'

# Annotation of a set of plants (rules annotation_grids, wastewater_join, download_bing_annotate):
# annotation_points_filepath is the set, every plant with a unique integer idx (it names the tile,
# the OSM files and the image). Each set keeps its own folders. Now: the plants without a HeiGIT size
# plus the new plants (AU, CA, JP, NZ, corrected EU file), idx after all_merged_v2's. The first global
# run (all_merged_v2.gpkg) is in annotations/GRID, annotations/osm_by_idx and
# /mnt/sds-hd/sd17f001/sukanya/wtp_seg/2026_global/annotated (merge_annotations keeps reading those).
NEW_01_GENERATEGRIDS:
  version: null
  annotations:
    cell_size: 3072
    factor: 1.194
  paths:
    data_dir: null
    annotation_points_filepath: '{data_dir}/heigit_sizes/plants_without_size_and_new_plants.gpkg'
    annotations_grid_dir: '{data_dir}/annotations/new_plants/GRID'

# OSM features per tile from Overpass (wwtp/annotation_scripts/NEW_02_...py; not in the workflow since
# 18 Nov 2026: osm_planet below does it from one planet file, for small sets only). One queue of tiles; every
# endpoint has `workers` requests at a time, a fast one answers more tiles. Public instances are shared
# (https://wiki.openstreetmap.org/wiki/Overpass_API): an identifying user agent, few parallel requests,
# and a long pause after a refusal. overpass-api.de (FOSSGIS) is overloaded and bans parallel scripts,
# load spread over its servers and retries after a 429: one request at a time, if at all. Which
# endpoints and how many workers: `snakemake overpass_benchmark` (overpass_benchmark section).
# Benchmark of 18 Nov 2026 (40 tiles, from Eren's laptop): OSM France answered 40/40 (median 6 s,
# current data); overpass-api.de 18/40 (instant 502s, 429s; 39 s); VK Maps 9/40 (instant 504s; 21 s);
# private.coffee and its old name kumi.systems 6/40 and 5/40 (90 s, data of 28 Jul 2026): left out.
NEW_02_EXTRACTOSMDATAFULL_GEOJSON:
  version: null
  overwrite_existing: false
  annotations:
    overpass_endpoints:
      - {url: 'https://overpass.openstreetmap.fr/api/interpreter', workers: 2}   # OSM France
      - {url: 'https://overpass-api.de/api/interpreter', workers: 1}
      - {url: 'https://maps.mail.ru/osm/tools/overpass/api/interpreter', workers: 2}   # VK Maps
    user_agent: 'HeiGIT-plant-capacity/1.0 (WWTP image annotation; one query per 3.7 km tile)'
    output_mode: 'geom'             # way coordinates inline ('body': nodes as elements, the first global run)
    query_timeout_seconds: 180      # [timeout:] of each query, on the server
    request_timeout_seconds: 120    # waiting for an answer (working servers answer a tile in seconds)
    refused_pause_seconds: 30       # an endpoint's pause after 429, 406, 503, 504 or a timeout (FOSSGIS: >= 30 s)
    max_attempts: 4                 # per tile and run, over all endpoints
    progress_every: 250             # tiles between progress lines in the log
  paths:
    data_dir: null
    annotation_points_filepath: null
    annotations_grid_dir: null
    annotations_by_osm_dir: '{data_dir}/annotations/new_plants/osm_by_idx'

# OSM features per tile from one OSM planet file instead of Overpass servers (wwtp/annotation_scripts/
# osm_planet.py; the workflow's annotation step). `prepare` once: the planet (~90 GB, the first URL
# that works, md5-checked) filtered to the tags NEW_02 asks for; `tiles` per plant set: the same
# features per tile as the Overpass query, all from one dated OSM snapshot (planet_info.json).
osm_planet:
  version: null
  planet_urls:   # weekly planet; mirrors first (faster), <url>.md5 next to each
    - 'https://ftp5.gwdg.de/pub/misc/openstreetmap/planet.openstreetmap.org/pbf/planet-latest.osm.pbf'
    - 'https://ftp.fau.de/osm-planet/pbf/planet-latest.osm.pbf'
    - 'https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf'
  keep_planet: false               # the filtered file (~10-20 GB) is kept; the planet is not
  osmium_version: '1.19.1'         # osmium-tool, installed from conda-forge when not on the PATH
  micromamba_url: 'https://conda.anaconda.org/conda-forge/linux-64/micromamba-2.10.0-0.tar.bz2'
  download_chunk_mb: 16
  request_timeout_seconds: 120
  workers: 4                       # processes writing the tile files (each may hold a copy of the features)
  tiles_per_task: 200
  paths:
    data_dir: null
    planet_dir: '{data_dir}/osm_planet'
    tools_dir: '{data_dir}/tools'
    annotation_points_filepath: null
    annotations_grid_dir: null
    annotations_by_osm_dir: null
    area_dir: '{data_dir}/annotations/new_plants/osm_area'

download_bing_annotate:
  version: null
  # An image farther than this from its plant (ref.geojson point vs annotation_points_filepath, same
  # idx) means the images were made for another plant list: the overlay stops before drawing.
  max_image_offset_m: 10
  annotations:
    cell_size: null
    factor: null
    # The new plants' images (Sukanya, 19 Nov 2026): 3072 x 3072 px at zoom 17 of 256 px tiles (1.194 m per
    # pixel in Web Mercator, so 3,669 m: NEW_01's tile), centred on the plant. Measured on a tennis court, a
    # running track and a football pitch (0.6 m/px would make them half their size). The work list's images of
    # 17-18 Nov were 512 px.
    image_size_px: 3072
    zoom_level: 17
    base_z17_resolution: 1.1943285669555664
    # processes per overlay job, one tile per task (= workflow.resources.download_bing_annotate.threads)
    max_workers: 64
    georeferenced: false
    # Label text and its outline in pixels of the output image (target_size_px): the first run drew 24 and 3
    # on its 3072 px images, 8 and 1 after the resize to 1024. Smaller images are enlarged before drawing.
    label_font_px: 8
    label_halo_px: 1
    dpi: 72
    target_size_px: 1024
    mercator_tile_size_px: 256
    # metres per pixel = base_z17_resolution x mercator_tile_size_px / this: 256 -> 1.194 (the new plants' images)
    imagery_reference_tile_size_px: 256
    # Which file is the image of a ref.geojson feature: ref_idx = <n>.png for the feature whose own idx is n (the
    # new plants' set: checked by eye on Banff, Lancie, Fey, Giromagny), ref_row = <n>.png for the n-th feature
    image_names: ref_idx
    earth_radius_m: 6378137
    # Single source of truth for annotation-pipeline seeding; declared here
    # because this is the earliest consumer.
    random_seed: 42
  paths:
    data_dir: null
    annotation_points_filepath: null
    annotations_grid_dir: null
    annotations_by_osm_dir: null
    annotations_temp_parquet_dir: '{data_dir}/annotations/new_plants/temp_parquets'
    # The images of the set: <row>.png per plant and ref.geojson with each plant's idx (row = image),
    # downloaded by Sukanya; the overlay goes next to them, as for the first global run.
    # 19 Nov 2026: the 5,384 new plants (national registers AU/CA/JP/NZ, corrected EU file). The work list's
    # images of 17-18 Nov (17,519 plants) are in .../2026_global_extra/Images_z17_512 (plants_v3 uses them).
    annotations_images_dir: '/mnt/sds-hd/sd17f001/sukanya/wtp_seg/2026_global_extra/Images_z17_3072/Images_z17_512'
    # ref.geojson's idx is the row (from 0) of the plant in the list the images were made from (the new
    # plants as Sukanya got them, 19 Nov 2026 = work_list.paths.new_plants, in git); the plant's idx is that
    # row's idx
    images_ref_list: '{data_dir}/heigit_sizes/new_plants_reference_2026-11-19.csv'
    # Apart from the overlay of the work list's images (.../annotated/mm/Images_z17_512)
    annotated_images_output_dir: '/mnt/sds-hd/sd17f001/sukanya/wtp_seg/2026_global_extra/annotated/mm/Images_z17_3072/Images_z17_512'
    # One row per image: its plant, its OSM tiles and how they were found, features, labels, errors
    match_report_dir: '{data_dir}/annotations/new_plants/overlay_match'

# Overpass endpoints compared on sample tiles (wwtp/annotation_scripts/overpass_benchmark.py; Snakemake
# target overpass_benchmark): which of them, with how many workers, NEW_02 should use.
overpass_benchmark:
  version: null
  annotations:
    candidates:
      - {url: 'https://maps.mail.ru/osm/tools/overpass/api/interpreter', workers: 4}
      - {url: 'https://overpass.private.coffee/api/interpreter', workers: 4}
      - {url: 'https://overpass.kumi.systems/api/interpreter', workers: 2}   # the old name of private.coffee
      - {url: 'https://overpass-api.de/api/interpreter', workers: 1}
      - {url: 'https://overpass.openstreetmap.fr/api/interpreter', workers: 1}   # OSM France
    sample_tiles: 40
    cell_size: null                 # NEW_01's tile
    factor: null
    compare_tiles: 8                # also asked in the other output_mode, one at a time
    min_answered_share: 0.9         # recommended: answers at least this share of the tiles ...
    min_agreement: 0.9              # ... and finds the same features as most endpoints for this share
    time_budget_minutes: 15         # per endpoint; tiles not asked by then count as not answered
    random_seed: null
    user_agent: null
    output_mode: null
    query_timeout_seconds: null
    request_timeout_seconds: 120    # a tile of 3.7 km takes seconds on a working server
    refused_pause_seconds: null
  paths:
    data_dir: null
    annotation_points_filepath: null
    annotations_grid_dir: null
    annotations_by_osm_dir: null
    output_dir: '{data_dir}/annotations/new_plants/overpass_benchmark'

