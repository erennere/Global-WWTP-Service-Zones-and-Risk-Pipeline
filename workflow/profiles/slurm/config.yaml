# snakemake --profile workflow/profiles/slurm   (from the repository root, in the pipeline's environment)
# Each stage becomes one SLURM job; threads, memory and runtime per stage come from
# wwtp/config.yaml, section `workflow.resources`. Add `slurm_account=<account>` to
# default-resources if the cluster needs one.
executor: slurm
# Greedy job selection: with a few parallel jobs it picks the same jobs as the ILP scheduler, without
# solver files. (The login session's $TMPDIR, removed at logout, is replaced for the whole run by
# workflow.paths.tmp_dir in the Snakefile, wf.use_durable_tmpdir.)
scheduler: greedy
jobs: 100
latency-wait: 60
retries: 1
rerun-incomplete: true
printshellcmds: true
default-resources:
  - slurm_partition=cpu-single
