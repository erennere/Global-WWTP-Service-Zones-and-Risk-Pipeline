name: wwtp-service-pipeline
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pyyaml
  - pydantic>=2  # typed config sections (wwtp/settings.py)
  - numpy
  - pandas
  - geopandas
  - shapely
  - pyproj
  - rasterio
  - exactextract
  - scipy
  - scikit-image
  - opencv
  - networkx
  - duckdb
  - pyarrow  # pd.read_parquet / to_parquet (Overture countries, risk outputs)
  - pyreadr  # wwtp/calibration/service_radius.py reads the census block-group .rda
  - joblib
  - tqdm
  - requests
  - pycountry
  - matplotlib
  - seaborn
  - pillow
  - cartopy
  - folium
  - branca
  - mercantile
  - pytest>=8
  - pytest-cov>=5
  - pytest-mock>=3.14
  - hypothesis>=6  # property tests (wwtp/tests/unit/test_*_oracle.py)
  - pip:
      - hdx-python-api
      # Declared in pyproject.toml but missing here, so a conda-only setup
      # could not import figures_scripts/interactive_unconnected_industrial_map.
      - mapbox-vector-tile