# Weekly and on demand: the slow end-to-end checks on the mock world, against the stored golden
# outputs (wwtp/tests/golden/mock_world_chain.json): every stage through its command line, and the
# Snakemake workflow (including the Figure 1 plan). A run on a real region needs data outside the
# repository and runs on the cluster: `snakemake --profile workflow/profiles/slurm` there.
name: Golden run

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test,workflow]"
      - name: Mock-world chain and workflow against the golden outputs
        env:
          MPLBACKEND: Agg
        run: >
          python -m pytest -p no:warnings -v
          wwtp/tests/integration/test_mock_world_chain.py
          wwtp/tests/integration/test_workflow_mock.py
